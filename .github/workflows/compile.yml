name: Shaiya Bridge CI - Flutter Windows
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    # R26 materializes its source checkpoint and invokes this same strict
    # reusable build using its exact SHA. Avoid testing an intermediate tree
    # a second time and occupying the Windows runner with superseded sources.
    if: github.ref_name != 'feat/studio-0626-compact-model-picker' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[restore-checkpoint]'))
    uses: ./.github/workflows/build.yml

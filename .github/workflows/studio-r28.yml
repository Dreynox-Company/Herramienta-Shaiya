name: ShStudio R28 stable inspector viewport and native actions
on:
  push:
    branches: [fix/studio-0628-startup-spk-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-r28-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.ref == 'refs/heads/fix/studio-0628-startup-spk-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-0628-startup-spk-recovery
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Apply checked integrations
        run: |
          python ci/refine_r28.py
          python ci/refine_r28_docks.py
          python ci/refine_r28_acceptance.py
          python ci/refine_r28_recovery.py
      - name: Restore original supplied branding
        run: python tool/prepare_branding.py
      - name: Register all regression suites
        shell: python
        run: |
          from pathlib import Path
          tests = sorted(Path('test').glob('*_test.dart'))
          imports = [f"import '../test/{p.name}' as suite{i};" for i, p in enumerate(tests)]
          calls = [f'  suite{i}.main();' for i in range(len(tests))]
          Path('tool/run_all_local.dart').write_text('// Complete local regression runner. Keep synchronized with test/*_test.dart.\n' + '\n'.join(imports) + '\n\nvoid main() {\n' + '\n'.join(calls) + '\n}\n')
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format and mechanical lint fixes
        run: |
          dart format lib test integration_test tool
          dart fix --apply --code=curly_braces_in_flow_control_structures,unnecessary_import,unused_import,use_null_aware_elements,unnecessary_brace_in_string_interps,sort_child_properties_last,await_only_futures
          dart format lib test integration_test tool
      - name: Commit exact readable checkpoint
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/studio-0628-startup-spk-recovery'
          git diff --check
          git add lib test integration_test tool docs assets platform pubspec.yaml ci .studio-r28-*
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(studio): materialize reviewed R28 inspector viewport and control repairs [skip ci]'
            git push origin HEAD:refs/heads/fix/studio-0628-startup-spk-recovery
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source and diagnostics
        if: always()
        run: |
          git archive --format=zip HEAD -o studio-r28-source.zip
          git diff --binary > studio-r28-uncommitted.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-R28-Source-Checkpoint
          path: |
            studio-r28-source.zip
            studio-r28-uncommitted.diff
          retention-days: 30
  verify:
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read

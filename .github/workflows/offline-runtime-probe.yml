name: Offline runtime - compatibility probe
on:
  push:
    branches: [work/native-bridge-integration]
    paths: [.github/workflows/offline-runtime-probe.yml, runtime/prepare_offline.py]
permissions:
  contents: read
jobs:
  compile-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch pinned reference and available authentication dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/aosyatnik/Imgeneus.git upstream
          git -C upstream checkout 0ce355594d521c3a06a08f24d0a9b60ebc8a459f
          git -C upstream submodule update --init --recursive --depth 1 -- submodules/LiteNetwork submodules/Parsec submodules/Sylver.HandlerInvoker
          git clone https://github.com/aosyatnik/Imgeneus.Authentication upstream/submodules/Imgeneus.Authentication
          git -C upstream/submodules/Imgeneus.Authentication checkout 77b3a65e9a0ba60f83e1aa452e9f0b997ea27a70
          mkdir -p probe
          git -C upstream submodule status --recursive > probe/submodule-versions.txt
          if test -f runtime/prepare_offline.py; then python runtime/prepare_offline.py upstream; fi
      - name: Compile ps0032 reference projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet build upstream/src/Imgeneus.Login/Imgeneus.Login.csproj -c SHAIYA_ps0032 --verbosity minimal 2>&1 | tee probe/login-build.log
          dotnet build upstream/src/Imgeneus.World/Imgeneus.World.csproj -c SHAIYA_ps0032 --verbosity minimal 2>&1 | tee probe/world-build.log
          echo 'Compilation does not prove compatibility with a user client or offline readiness.' > probe/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Offline-runtime-compatibility-probe
          path: probe/
          retention-days: 7

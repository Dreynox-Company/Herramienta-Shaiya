name: V3 local validation dependencies
on:
  push:
    branches: [fix/studio-062-v3-wings-spk]
    paths: [.github/workflows/v3-validation-tools.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Bundle every actual hosted dependency root
        shell: python
        run: |
          import json, pathlib, os, tarfile, urllib.parse
          out=pathlib.Path('transfer');out.mkdir(exist_ok=True)
          roots={}
          for config in [pathlib.Path('.dart_tool/package_config.json'),pathlib.Path(os.environ['FLUTTER_ROOT'])/'packages/flutter_tools/.dart_tool/package_config.json']:
              for p in json.loads(config.read_text())['packages']:
                  uri=urllib.parse.urljoin(config.resolve().as_uri(),p['rootUri'])
                  f=pathlib.Path(urllib.parse.unquote(urllib.parse.urlparse(uri).path)).resolve()
                  if 'hosted' in f.parts and (f/'pubspec.yaml').exists(): roots[f.name]=f
          with tarfile.open(out/'pub-all.tar.gz','w:gz',dereference=True) as t:
              for name,f in sorted(roots.items()): t.add(f,arcname='hosted/pub.dev/'+name)
          (out/'roots.json').write_text(json.dumps({n:str(p) for n,p in roots.items()},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: V3-validation-all-packages
          path: transfer/
          retention-days: 7

name: Flutter game client v1
on:
  push:
    branches: [work/flutter-game-client-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-game-client-v1
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build actual-format fixture
        shell: pwsh
        run: |
          $fixture=Join-Path $env:RUNNER_TEMP 'shaiya-game-fixture'
          python tool/make_native_fixture.py $fixture
          if($LASTEXITCODE -ne 0){throw 'fixture failed'}
          "SHAIYA_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Native game-mode smoke and screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qa-game | Out-Null
          $exe=(Resolve-Path build/windows/x64/runner/Release/herramienta_shaiya.exe).Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @("--data=$env:SHAIYA_FIXTURE") -PassThru
          try{
            Start-Sleep 20
            $p.Refresh()
            if($p.HasExited){throw "game client exited $($p.ExitCode)"}
            if($p.MainWindowHandle -eq 0){throw 'no visible game window'}
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $im=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($im)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $im.Save((Resolve-Path qa-game).Path+'\flutter-game.png',[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$im.Dispose()
            @{alive=$true;title=$p.MainWindowTitle;mode='game';flutter=$true;vmProtect=$false;antiVm=$false} | ConvertTo-Json | Set-Content qa-game/result.json
          }finally{
            if(!$p.HasExited){$p.CloseMainWindow()|Out-Null;Start-Sleep 2;$p.Refresh();if(!$p.HasExited){$p.Kill()}}
          }
      - name: Include launch scripts
        shell: pwsh
        run: |
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe"
          '@ | Set-Content build/windows/x64/runner/Release/JUGAR_FLUTTER.cmd
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe" --studio
          '@ | Set-Content build/windows/x64/runner/Release/ABRIR_STUDIO_DEBUG.cmd
          'Dreynox Shaiya Flutter Game Client V1 - build experimental de compatibilidad.' | Set-Content build/windows/x64/runner/Release/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Shaiya-Flutter-Game-Windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-Game-QA
          path: qa-game/
          retention-days: 14

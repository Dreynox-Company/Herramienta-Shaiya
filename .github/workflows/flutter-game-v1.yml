name: Flutter game client v1
on:
  push:
    branches: [work/flutter-game-client-v1, work/flutter-game-client-v7-stable, work/flutter-game-client-v8-complete]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-game-client-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35546792715
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend-archive
      - name: Bundle the validated 0.1.2 localhost backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check zstandard
          @'
          import pathlib,tarfile,zstandard
          src=pathlib.Path('backend-archive/native-services-win-x64.tar.zst')
          dst=pathlib.Path('build/windows/x64/runner/Release/servicios')
          dst.mkdir(parents=True,exist_ok=True)
          with src.open('rb') as f:
            with zstandard.ZstdDecompressor().stream_reader(f) as stream:
              with tarfile.open(fileobj=stream,mode='r|') as t:t.extractall(dst,filter='data')
          maps=pathlib.Path('build/windows/x64/runner/Release/server/maps')
          maps.mkdir(parents=True,exist_ok=True)
          svmaps=list((dst/'world/config/maps').glob('*.svmap'))
          for sv in svmaps:(maps/sv.name).write_bytes(sv.read_bytes())
          metadata=pathlib.Path('build/windows/x64/runner/Release/server/metadata')
          metadata.mkdir(parents=True,exist_ok=True)
          (metadata/'character.json').write_bytes((dst/'world/config/character.json').read_bytes())
          print('backend files',sum(1 for p in dst.rglob('*') if p.is_file()),'svmaps',len(svmaps))
          '@ | Set-Content bundle_backend.py
          python bundle_backend.py
          if($LASTEXITCODE -ne 0){throw 'backend bundle failed'}
      - name: Export exact NPC and quest metadata used by the backend
        shell: pwsh
        run: |
          $world=(Resolve-Path build/windows/x64/runner/Release/servicios/world).Path
          $input=Join-Path $world 'config/SData/NpcQuest.SData'
          $out='build/windows/x64/runner/Release/server/metadata/npc_quest.json'
          dotnet run --project tool/metadata_exporter/MetadataExporter.csproj -c Release -p:ParsecDir="$world" -- "$input" "$out"
          if($LASTEXITCODE -ne 0){throw 'metadata exporter failed'}
          if(!(Test-Path $out)){throw 'metadata json missing'}
          Get-Item $out | Select-Object FullName,Length
      - name: Live ps0032 protocol gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qa-game,protocol-slot | Out-Null
          $secret='FlutterProtocol2026!'
          $token='0123456789abcdef0123456789abcdef0123456789abcdef'
          $env:SHAIYA_OFFLINE_SLOT=(Resolve-Path protocol-slot).Path
          $env:SHAIYA_OFFLINE_FACTION='light'
          $env:SHAIYA_OFFLINE_PASSWORD=$secret
          $env:SHAIYA_OFFLINE_TOKEN=$token
          $env:SHAIYA_PROTOCOL_REPORT=(Join-Path (Resolve-Path qa-game).Path 'protocol.json')
          function Wait-Health([int]$port){
            $deadline=(Get-Date).AddSeconds(60)
            while((Get-Date) -lt $deadline){
              try{
                $r=Invoke-WebRequest -UseBasicParsing -Uri ("http://127.0.0.1:"+$port+"/offline/status") -Headers @{Authorization=("Bearer "+$token)} -TimeoutSec 2
                if($r.StatusCode -eq 200){return}
              }catch{}
              Start-Sleep -Milliseconds 400
            }
            throw "health timeout $port"
          }
          $login=Start-Process (Resolve-Path build/windows/x64/runner/Release/servicios/login/Imgeneus.Login.exe) -WorkingDirectory (Resolve-Path build/windows/x64/runner/Release/servicios/login) -RedirectStandardOutput qa-game/protocol-login.log -RedirectStandardError qa-game/protocol-login.err -PassThru
          try{
            Wait-Health 5000
            $world=Start-Process (Resolve-Path build/windows/x64/runner/Release/servicios/world/Imgeneus.World.exe) -WorkingDirectory (Resolve-Path build/windows/x64/runner/Release/servicios/world) -RedirectStandardOutput qa-game/protocol-world.log -RedirectStandardError qa-game/protocol-world.err -PassThru
            try{
              Wait-Health 5001
              dart run tool/protocol_probe.dart
              if($LASTEXITCODE -ne 0){throw 'protocol probe failed'}
              $report=Get-Content qa-game/protocol.json -Raw | ConvertFrom-Json
              if(!$report.ok){throw 'protocol report not ok'}
              if($report.enteredMapPackets -lt 1){throw 'CHARACTER_ENTERED_MAP missing'}
              if($report.npcPackets -lt 1){throw 'MAP_NPC_ENTER missing'}
              if($report.mobPackets -lt 1){throw 'MOB_ENTER missing'}
              if(!$report.movement.sent){throw 'CHARACTER_MOVE was not sent'}
              if(!$report.tutorialQuest.npcFound){throw 'tutorial NPC 7:1167 missing'}
              if(!$report.tutorialQuest.startConfirmed){throw 'QUEST_START 3781 was not confirmed'}
            }finally{
              if(!$world.HasExited){Stop-Process -Id $world.Id -Force}
            }
          }finally{
            if(!$login.HasExited){Stop-Process -Id $login.Id -Force}
          }
      - name: Build actual-format fixture
        shell: pwsh
        run: |
          $fixture=Join-Path $env:RUNNER_TEMP 'shaiya-game-fixture'
          python tool/make_native_fixture.py $fixture
          if($LASTEXITCODE -ne 0){throw 'fixture failed'}
          "SHAIYA_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Native Flutter renderer smoke - actual framebuffer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qa-game | Out-Null
          $env:SHAIYA_FIXTURE_PATH=$env:SHAIYA_FIXTURE
          $env:SHAIYA_QA_PATH=(Resolve-Path qa-game).Path
          $env:SHAIYA_QA_DISABLE_BACKEND='1'
          $env:SHAIYA_UI_LOCALE='usa'
          $env:SHAIYA_EXPECT_REAL_DATA='0'
          flutter test integration_test/game_visual_parity_test.dart -d windows --reporter expanded
          if($LASTEXITCODE -ne 0){throw 'Flutter framebuffer integration test failed'}
          if(!(Test-Path qa-game/world.png)){throw 'world framebuffer screenshot missing'}
          if(!(Test-Path qa-game/integration-state.json)){throw 'integration state missing'}
      - name: Include launch scripts
        shell: pwsh
        run: |
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe"
          '@ | Set-Content build/windows/x64/runner/Release/JUGAR_FLUTTER.cmd
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe" --studio
          '@ | Set-Content build/windows/x64/runner/Release/ABRIR_STUDIO_DEBUG.cmd
          'Dreynox Shaiya Flutter Game Client V1 - build experimental de compatibilidad.' | Set-Content build/windows/x64/runner/Release/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Shaiya-Flutter-Game-Windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-Game-QA
          path: qa-game/
          retention-days: 14


  parity-real-data:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: Dreynox-Shaiya-Flutter-Game-Windows-x64
          path: flutter-client
      - uses: actions/download-artifact@v4
        with:
          name: Native-Windows-Interaction-Proof
          run-id: 35547109100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-reference
      - name: Prepare Flutter Windows integration runner and packaged server metadata
        shell: pwsh
        run: |
          python tool/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Flutter Windows runner preparation failed'}
          flutter pub get
          if($LASTEXITCODE -ne 0){throw 'flutter pub get failed'}
          $server=(Get-ChildItem flutter-client -Directory -Filter server -Recurse | Select-Object -First 1).FullName
          if(!$server){throw 'Packaged server metadata directory missing'}
          Copy-Item $server server -Recurse -Force
          if(!(Test-Path server/maps/1.svmap)){throw '1.svmap missing'}
          if(!(Test-Path server/maps/2.svmap)){throw '2.svmap missing'}
          if(!(Test-Path server/metadata/npc_quest.json)){throw 'NpcQuest metadata missing'}
          if(!(Test-Path server/metadata/character.json)){throw 'character config missing'}
      - name: Recover exact public ps0032 DATA used by native reference
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force public-client,parity-report | Out-Null
          @'
          import pathlib,tarfile,urllib.request,time
          target=pathlib.Path('public-client')
          wanted={'game.exe','data.sah','data.saf'}
          found=set();started=time.monotonic()
          url='https://archive.openshaiya.org/api/build/shaiya-ga-ps0032.tar.gz'
          with urllib.request.urlopen(url,timeout=180) as r:
            with tarfile.open(fileobj=r,mode='r|gz') as t:
              for entry in t:
                if not entry.isfile(): continue
                name=pathlib.PurePosixPath(entry.name.replace('\\','/')).name.lower()
                if name not in wanted: continue
                src=t.extractfile(entry)
                if src is None: continue
                dst=target/name
                with dst.open('wb') as out:
                  while True:
                    block=src.read(8*1024*1024)
                    if not block: break
                    out.write(block)
                found.add(name)
                print(name,dst.stat().st_size)
                if found==wanted: break
          if found!=wanted: raise RuntimeError('public ps0032 game/SAH/SAF not found: '+repr(found))
          print('download seconds',round(time.monotonic()-started,1))
          '@ | Set-Content recover_public_data.py
          python recover_public_data.py
          if($LASTEXITCODE -ne 0){throw 'public data recovery failed'}
          python native-ci/prepare_raw.py public-client/game.exe
          if($LASTEXITCODE -ne 0){throw 'raw public DATA extraction failed'}
          $data=(Resolve-Path public-client/data).Path
          "SHAIYA_REAL_DATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $data -Recurse -File | Measure-Object | Select-Object Count
      - name: Render all Flutter parity scenes with the real Windows renderer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:SHAIYA_PARITY_DATA=$env:SHAIYA_REAL_DATA
          $env:SHAIYA_QA_PATH=(Resolve-Path parity-report).Path
          $env:SHAIYA_QA_DISABLE_BACKEND='1'
          $env:SHAIYA_UI_LOCALE='usa'
          $env:SHAIYA_EXPECT_REAL_DATA='1'
          flutter test integration_test/game_visual_parity_test.dart -d windows --reporter expanded
          if($LASTEXITCODE -ne 0){throw 'real-DATA Flutter parity integration test failed'}
          foreach($s in @('faction','characterSelect','characterCreate','characterMode','world')){
            if(!(Test-Path ("parity-report/"+$s+".png"))){throw "missing framebuffer: $s"}
          }
      - name: Capture actual Windows client surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WinCapture {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X,Y; }
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hWnd,out RECT r);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr hWnd,ref POINT p);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          function Capture-Client([System.Diagnostics.Process]$p,[string]$path){
            $p.Refresh()
            if($p.HasExited){ throw "process exited before capture" }
            $h=$p.MainWindowHandle
            if($h -eq 0){ throw "no main window handle" }
            [WinCapture]::SetForegroundWindow($h) | Out-Null
            $r=New-Object WinCapture+RECT
            if(![WinCapture]::GetClientRect($h,[ref]$r)){ throw "GetClientRect failed" }
            $pt=New-Object WinCapture+POINT
            $pt.X=0;$pt.Y=0
            if(![WinCapture]::ClientToScreen($h,[ref]$pt)){ throw "ClientToScreen failed" }
            $w=$r.Right-$r.Left;$hgt=$r.Bottom-$r.Top
            if($w -lt 200 -or $hgt -lt 200){ throw "invalid client size $w x $hgt" }
            $bmp=New-Object System.Drawing.Bitmap $w,$hgt
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try{
              $g.CopyFromScreen($pt.X,$pt.Y,0,0,$bmp.Size,[System.Drawing.CopyPixelOperation]::SourceCopy)
              $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            }finally{$g.Dispose();$bmp.Dispose()}
          }
          $exe=(Get-ChildItem flutter-client -Filter herramienta_shaiya.exe -File -Recurse | Select-Object -First 1).FullName
          if(!$exe){throw 'Flutter Windows executable missing'}
          $work=Split-Path $exe
          $env:SHAIYA_QA_DISABLE_BACKEND='1'
          $env:SHAIYA_UI_LOCALE='usa'
          foreach($stage in @('faction','characterSelect','characterCreate','characterMode','world')){
            $marker=(Join-Path (Resolve-Path parity-report) ('os-'+$stage+'-ready.json'))
            if(Test-Path $marker){Remove-Item $marker -Force}
            $args=@("--data=$env:SHAIYA_REAL_DATA","--qa-stage=$stage","--qa-marker=$marker")
            $p=Start-Process $exe -WorkingDirectory $work -ArgumentList $args -PassThru
            try{
              $deadline=(Get-Date).AddMinutes(5)
              while(!(Test-Path $marker)){
                $p.Refresh()
                if($p.HasExited){throw "Flutter $stage exited early"}
                if((Get-Date) -gt $deadline){throw "timeout waiting for $stage marker"}
                Start-Sleep -Milliseconds 500
              }
              $state=Get-Content $marker -Raw | ConvertFrom-Json
              if($state.loading){throw "$stage marker still reports loading"}
              if(!$state.character){throw "$stage did not load a character"}
              if($stage -eq 'world' -and [string]::IsNullOrWhiteSpace($state.world)){throw 'world stage did not load a WLD'}
              Start-Sleep -Seconds 3
              Capture-Client $p (Join-Path (Resolve-Path parity-report) ('os-'+$stage+'.png'))
            }finally{
              $p.Refresh()
              if(!$p.HasExited){
                $p.CloseMainWindow() | Out-Null
                Start-Sleep -Seconds 1
                $p.Refresh()
                if(!$p.HasExited){$p.Kill()}
              }
            }
          }

      - name: Compare native and Flutter scenes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          @'
          import json,pathlib
          import numpy as np
          from PIL import Image,ImageChops,ImageEnhance
          root=pathlib.Path('parity-report')
          native=pathlib.Path('native-reference')
          mapping={
            'faction':'03-faction-selected.png',
            'characterSelect':'08-character-selected.png',
            'characterCreate':'05-character-editor.png',
            'characterMode':'06c-mode-selected.png',
            'world':'09-world-entry.png',
          }
          def flutter_image(stage):
            os_capture=root/f'os-{stage}.png'
            source=os_capture if os_capture.exists() else root/f'{stage}.png'
            return Image.open(source).convert('RGB').resize((1024,742))
          def native_image(name):
            p=next(native.rglob(name))
            im=Image.open(p).convert('RGB').resize((1024,768))
            return im.crop((0,26,1024,768)),p
          report={}
          for stage,refname in mapping.items():
            fa=flutter_image(stage)
            nb,rp=native_image(refname)
            a=np.asarray(fa,dtype=np.float32)
            b=np.asarray(nb,dtype=np.float32)
            mae=float(np.mean(np.abs(a-b))/255.0)
            grayA=np.mean(a,axis=2);grayB=np.mean(b,axis=2)
            ax=np.diff(grayA,axis=1,prepend=grayA[:,:1]);ay=np.diff(grayA,axis=0,prepend=grayA[:1])
            bx=np.diff(grayB,axis=1,prepend=grayB[:,:1]);by=np.diff(grayB,axis=0,prepend=grayB[:1])
            ea=np.hypot(ax,ay);eb=np.hypot(bx,by)
            denom=float(np.linalg.norm(ea.ravel())*np.linalg.norm(eb.ravel()))
            edge=float(np.dot(ea.ravel(),eb.ravel())/denom) if denom else 0.0
            lum=float(np.corrcoef(grayA.ravel(),grayB.ravel())[0,1])
            report[stage]={
              'pixelSimilarity':round(1-mae,5),
              'edgeCorrelation':round(edge,5),
              'luminanceCorrelation':round(lum,5),
              'native':str(rp),
              'flutter':str((root/f'os-{stage}.png') if (root/f'os-{stage}.png').exists() else (root/f'{stage}.png')),
            }
            diff=ImageChops.difference(fa,nb)
            ImageEnhance.Contrast(diff).enhance(2.0).save(root/f'diff-{stage}.png')
            canvas=Image.new('RGB',(2048,742),'black')
            canvas.paste(nb,(0,0));canvas.paste(fa,(1024,0))
            canvas.save(root/f'side-by-side-{stage}.jpg',quality=91)
          (root/'visual-parity.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if any(v['pixelSimilarity']<0.18 for v in report.values()):
            raise SystemExit('visual parity gross-regression gate failed')
          '@ | Set-Content compare_parity.py
          python compare_parity.py
          if($LASTEXITCODE -ne 0){throw 'visual parity comparison failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-Native-Visual-Parity
          path: parity-report/
          retention-days: 14

name: Flutter game client v1
on:
  push:
    branches: [work/flutter-game-client-v1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-game-client-v1
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35546792715
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend-archive
      - name: Bundle the validated 0.1.2 localhost backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check zstandard
          @'
          import pathlib,tarfile,zstandard
          src=pathlib.Path('backend-archive/native-services-win-x64.tar.zst')
          dst=pathlib.Path('build/windows/x64/runner/Release/servicios')
          dst.mkdir(parents=True,exist_ok=True)
          with src.open('rb') as f:
            with zstandard.ZstdDecompressor().stream_reader(f) as stream:
              with tarfile.open(fileobj=stream,mode='r|') as t:t.extractall(dst,filter='data')
          sv=dst/'world/config/maps/1.svmap'
          target=pathlib.Path('build/windows/x64/runner/Release/server/maps/1.svmap')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(sv.read_bytes())
          print('backend files',sum(1 for p in dst.rglob('*') if p.is_file()),'svmap',target.stat().st_size)
          '@ | Set-Content bundle_backend.py
          python bundle_backend.py
          if($LASTEXITCODE -ne 0){throw 'backend bundle failed'}
      - name: Export exact NPC and quest metadata used by the backend
        shell: pwsh
        run: |
          $world=(Resolve-Path build/windows/x64/runner/Release/servicios/world).Path
          $input=Join-Path $world 'config/SData/NpcQuest.SData'
          $out='build/windows/x64/runner/Release/server/metadata/npc_quest.json'
          dotnet run --project tool/metadata_exporter/MetadataExporter.csproj -c Release -p:ParsecDir="$world" -- "$input" "$out"
          if($LASTEXITCODE -ne 0){throw 'metadata exporter failed'}
          if(!(Test-Path $out)){throw 'metadata json missing'}
          Get-Item $out | Select-Object FullName,Length
      - name: Build actual-format fixture
        shell: pwsh
        run: |
          $fixture=Join-Path $env:RUNNER_TEMP 'shaiya-game-fixture'
          python tool/make_native_fixture.py $fixture
          if($LASTEXITCODE -ne 0){throw 'fixture failed'}
          "SHAIYA_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Native parity smoke - faction, selection, creation and world
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qa-game | Out-Null
          $exe=(Resolve-Path build/windows/x64/runner/Release/herramienta_shaiya.exe).Path
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowRect {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
          }
          '@
          function Capture-Window($p,[string]$name){
            $p.Refresh()
            if($p.HasExited){throw "game client exited during $name"}
            if($p.MainWindowHandle -eq 0){throw "no visible window during $name"}
            $r=New-Object WindowRect+RECT
            [WindowRect]::GetWindowRect($p.MainWindowHandle,[ref]$r)|Out-Null
            $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top
            $im=New-Object System.Drawing.Bitmap $w,$h
            $g=[System.Drawing.Graphics]::FromImage($im)
            $g.CopyFromScreen($r.Left,$r.Top,0,0,$im.Size)
            $im.Save((Join-Path (Resolve-Path qa-game) ($name+'.png')),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$im.Dispose()
          }
          $results=@()
          foreach($stage in @('faction','characterSelect','characterCreate','characterMode','world')){
            $marker=(Join-Path (Resolve-Path qa-game) ($stage+'-ready.json'))
            if(Test-Path $marker){Remove-Item $marker -Force}
            $env:SHAIYA_QA_READY_FILE=$marker
            $env:SHAIYA_QA_DISABLE_BACKEND='1'
            $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @("--data=$env:SHAIYA_FIXTURE","--qa-stage=$stage") -PassThru
            try{
              $deadline=(Get-Date).AddSeconds(90)
              while(!(Test-Path $marker)){
                $p.Refresh()
                if($p.HasExited){throw "game client exited before $stage became ready"}
                if((Get-Date) -gt $deadline){throw "timeout waiting for $stage readiness marker"}
                Start-Sleep -Milliseconds 500
              }
              Start-Sleep 2
              Capture-Window $p $stage
              $state=Get-Content $marker -Raw | ConvertFrom-Json
              if(!$state.ready){throw "$stage marker reports failure: $($state.error)"}
              if($state.loading){throw "$stage marker still reports loading"}
              if(!$state.scene.character){throw "$stage has no loaded character"}
              if($stage -eq 'world' -and [string]::IsNullOrWhiteSpace($state.scene.world)){throw 'world stage did not load a WLD'}
              $results+=@{stage=$stage;alive=$true;title=$p.MainWindowTitle;state=$state}
            }finally{
              $p.Refresh()
              if(!$p.HasExited){
                $p.CloseMainWindow()|Out-Null
                Start-Sleep 4
                $p.Refresh()
                if(!$p.HasExited){$p.Kill();Start-Sleep 2}
              }
            }
          }
          @{flutter=$true;vmProtect=$false;antiVm=$false;stages=$results} | ConvertTo-Json -Depth 5 | Set-Content qa-game/result.json
      - name: Include launch scripts
        shell: pwsh
        run: |
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe"
          '@ | Set-Content build/windows/x64/runner/Release/JUGAR_FLUTTER.cmd
          @'
          @echo off
          start "" "%~dp0herramienta_shaiya.exe" --studio
          '@ | Set-Content build/windows/x64/runner/Release/ABRIR_STUDIO_DEBUG.cmd
          'Dreynox Shaiya Flutter Game Client V1 - build experimental de compatibilidad.' | Set-Content build/windows/x64/runner/Release/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Shaiya-Flutter-Game-Windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-Game-QA
          path: qa-game/
          retention-days: 14


  parity-real-data:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Dreynox-Shaiya-Flutter-Game-Windows-x64
          path: flutter-client
      - uses: actions/download-artifact@v4
        with:
          name: Native-Windows-Interaction-Proof
          run-id: 35547109100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-reference
      - name: Recover exact public ps0032 DATA used by native reference
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force public-client,proof | Out-Null
          @'
          import pathlib,tarfile,urllib.request,time
          target=pathlib.Path('public-client')
          wanted={'game.exe','data.sah','data.saf'}
          found=set();started=time.monotonic()
          url='https://archive.openshaiya.org/api/build/shaiya-ga-ps0032.tar.gz'
          with urllib.request.urlopen(url,timeout=180) as r:
            with tarfile.open(fileobj=r,mode='r|gz') as t:
              for entry in t:
                if not entry.isfile(): continue
                name=pathlib.PurePosixPath(entry.name.replace('\\','/')).name.lower()
                if name not in wanted: continue
                src=t.extractfile(entry)
                if src is None: continue
                dst=target/name
                with dst.open('wb') as out:
                  while True:
                    block=src.read(8*1024*1024)
                    if not block: break
                    out.write(block)
                found.add(name)
                print(name,dst.stat().st_size)
                if found==wanted: break
          if found!=wanted: raise RuntimeError('public ps0032 client files not found: '+repr(found))
          print('download seconds',round(time.monotonic()-started,1))
          '@ | Set-Content recover_public_data.py
          python recover_public_data.py
          if($LASTEXITCODE -ne 0){throw 'public data recovery failed'}
          python native-ci/prepare_raw.py public-client/game.exe
          if($LASTEXITCODE -ne 0){throw 'raw public DATA extraction failed'}
          $data=(Resolve-Path public-client/data).Path
          "SHAIYA_REAL_DATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $data -Recurse -File | Measure-Object | Select-Object Count
      - name: Capture the four Flutter states only after READY
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force parity-report | Out-Null
          $exe=(Get-ChildItem flutter-client -Recurse -Filter herramienta_shaiya.exe | Select-Object -First 1).FullName
          if(!$exe){throw 'Flutter executable missing'}
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ParityWindow {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
          }
          '@
          function Capture-Window($p,[string]$name){
            $p.Refresh()
            if($p.HasExited){throw "Flutter exited during $name"}
            $r=New-Object ParityWindow+RECT
            if(![ParityWindow]::GetWindowRect($p.MainWindowHandle,[ref]$r)){throw "GetWindowRect failed: $name"}
            $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top
            $im=New-Object System.Drawing.Bitmap $w,$h
            $g=[System.Drawing.Graphics]::FromImage($im)
            $g.CopyFromScreen($r.Left,$r.Top,0,0,$im.Size)
            $im.Save((Join-Path (Resolve-Path parity-report) ('flutter-'+$name+'.png')),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$im.Dispose()
          }
          $states=@()
          foreach($stage in @('faction','characterSelect','characterCreate','world')){
            $marker=(Join-Path (Resolve-Path parity-report) ($stage+'-ready.json'))
            if(Test-Path $marker){Remove-Item $marker -Force}
            $env:SHAIYA_QA_READY_FILE=$marker
            $env:SHAIYA_QA_DISABLE_BACKEND='1'
            $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @("--data=$env:SHAIYA_REAL_DATA","--qa-stage=$stage") -PassThru
            try{
              $deadline=(Get-Date).AddMinutes(6)
              while(!(Test-Path $marker)){
                $p.Refresh()
                if($p.HasExited){throw "Flutter exited before $stage READY"}
                if((Get-Date) -gt $deadline){throw "timeout waiting for real-DATA $stage"}
                Start-Sleep -Milliseconds 750
              }
              $state=Get-Content $marker -Raw | ConvertFrom-Json
              if(!$state.ready){throw "$stage failed: $($state.error)"}
              Start-Sleep 3
              Capture-Window $p $stage
              $states+=@{stage=$stage;state=$state}
            }finally{
              $p.Refresh()
              if(!$p.HasExited){
                $p.CloseMainWindow()|Out-Null
                Start-Sleep 4
                $p.Refresh()
                if(!$p.HasExited){$p.Kill();Start-Sleep 2}
              }
            }
          }
          $states | ConvertTo-Json -Depth 8 | Set-Content parity-report/flutter-states.json
      - name: Compare native and Flutter scenes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          @'
          import json,pathlib
          import numpy as np
          from PIL import Image,ImageChops,ImageEnhance
          root=pathlib.Path('parity-report')
          native=pathlib.Path('native-reference')
          mapping={
            'faction':'03-faction-selected.png',
            'characterSelect':'07-character-created.png',
            'characterCreate':'05-character-editor.png',
            'characterMode':'06c-mode-selected.png',
            'world':'09-world-entry.png',
          }
          def load(p):
            im=Image.open(p).convert('RGB').resize((1024,768))
            return np.asarray(im,dtype=np.float32)
          report={}
          for stage,refname in mapping.items():
            fp=root/f'flutter-{stage}.png'
            rp=next(native.rglob(refname))
            a=load(fp);b=load(rp)
            # Ignore the Windows title bar. It is not part of either game UI.
            a=a[26:];b=b[26:]
            mae=float(np.mean(np.abs(a-b))/255.0)
            grayA=np.mean(a,axis=2);grayB=np.mean(b,axis=2)
            ax=np.diff(grayA,axis=1,prepend=grayA[:,:1]);ay=np.diff(grayA,axis=0,prepend=grayA[:1])
            bx=np.diff(grayB,axis=1,prepend=grayB[:,:1]);by=np.diff(grayB,axis=0,prepend=grayB[:1])
            ea=np.hypot(ax,ay);eb=np.hypot(bx,by)
            denom=float(np.linalg.norm(ea.ravel())*np.linalg.norm(eb.ravel()))
            edge=float(np.dot(ea.ravel(),eb.ravel())/denom) if denom else 0.0
            lum=float(np.corrcoef(grayA.ravel(),grayB.ravel())[0,1])
            report[stage]={
              'pixelSimilarity':round(1-mae,5),
              'edgeCorrelation':round(edge,5),
              'luminanceCorrelation':round(lum,5),
              'native':str(rp),
              'flutter':str(fp),
            }
            ia=Image.fromarray(a.astype('uint8'))
            ib=Image.fromarray(b.astype('uint8'))
            diff=ImageChops.difference(ia,ib)
            ImageEnhance.Contrast(diff).enhance(2.0).save(root/f'diff-{stage}.png')
          (root/'visual-parity.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          # Gross-regression gate: never accept loading/error/blank screens as parity evidence.
          if any(v['pixelSimilarity']<0.18 for v in report.values()):
            raise SystemExit('visual parity gross-regression gate failed')
          '@ | Set-Content compare_parity.py
          python compare_parity.py
          if($LASTEXITCODE -ne 0){throw 'visual parity comparison failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-Native-Visual-Parity
          path: parity-report/
          retention-days: 14

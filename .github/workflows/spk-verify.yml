name: SPK integration formatter and verifier

on:
  push:
    branches:
      - feat/studio-063-spk-archive-browser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart sources
        run: |
          dart format             lib/core/spk_archive.dart             lib/data/spk_source.dart             lib/ui/spk_archive_browser.dart             lib/main.dart             test/spk_archive_test.dart
      - name: Analyze project
        continue-on-error: true
        run: flutter analyze 2>&1 | tee spk-analyze.txt
      - name: Run focused SPK tests
        continue-on-error: true
        run: flutter test test/spk_archive_test.dart --reporter expanded 2>&1 | tee spk-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SPK-formatted-sources
          path: |
            pubspec.lock
            lib/core/spk_archive.dart
            lib/data/spk_source.dart
            lib/ui/spk_archive_browser.dart
            lib/main.dart
            test/spk_archive_test.dart
            spk-analyze.txt
            spk-tests.txt
          if-no-files-found: error
          retention-days: 7

name: Aplicar correcciones nativas verificadas
on:
  push:
    branches: [feat/flutter-native-studio]
    paths: [tool/upgrade_native.py, .github/workflows/upgrade_native.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-native-studio
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Comprobar y actualizar las fuentes
        run: |
          python3 tool/upgrade_native.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/core/motion_catalog.dart')
          s=p.read_text()
          s=s.replace('9=>63,10=>77','9=>64,10=>78').replace('15=>70','15=>71')
          s=s.replace("63:'Guardia · daga invertida'", "64:'Guardia · daga invertida'")
          s=s.replace("70:'Guardia · garras'", "71:'Guardia · garras'")
          s=s.replace("77:'Guardia · daga'", "78:'Guardia · daga'")
          p.write_text(s)
          p=Path('test/recovery_test.dart');s=p.read_text()
          s=s.replace("expect(damageMotion(5),46);", "expect(damageMotion(5),46);expect(attackMotions(9),[65,66,67,68]);expect(attackMotions(10),[79,80,81,82]);expect(attackMotions(15),[72,73,74,75]);")
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Formato de fuentes Dart y pruebas
        run: dart format lib test tool/audit_assets.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - name: Publicar solamente si las pruebas pasan y la rama no cambio
        run: |
          test "$GITHUB_REF_NAME" = 'feat/flutter-native-studio'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm tool/upgrade_native.py .github/workflows/upgrade_native.yml
          git add lib test tool/audit_assets.dart pubspec.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore valid mesh data, coordinate equipment and motion; format and lock native sources'
          git push origin HEAD:refs/heads/feat/flutter-native-studio

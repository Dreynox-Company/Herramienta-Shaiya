name: Flutter ps0032 protocol
on:
  push:
    branches: [work/flutter-protocol-ps0032-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-protocol-ps0032-v2
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/protocol test/ps0032_packet_test.dart test/ps0032_crypto_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/protocol test/ps0032_packet_test.dart test/ps0032_crypto_test.dart
      - run: flutter test test/ps0032_packet_test.dart test/ps0032_crypto_test.dart --reporter expanded

  live-windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35546792715
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend-archive
      - name: Extract backend 0.1.2
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check zstandard
          @'
          import pathlib,tarfile,zstandard
          src=pathlib.Path('backend-archive/native-services-win-x64.tar.zst')
          dst=pathlib.Path('backend')
          dst.mkdir(exist_ok=True)
          with src.open('rb') as f:
            with zstandard.ZstdDecompressor().stream_reader(f) as stream:
              with tarfile.open(fileobj=stream,mode='r|') as t:
                t.extractall(dst,filter='data')
          print('files',sum(1 for p in dst.rglob('*') if p.is_file()))
          '@ | Set-Content extract_backend.py
          python extract_backend.py
      - name: Live ps0032 Login World bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $slot=(Join-Path $env:RUNNER_TEMP 'flutter-ps0032-slot')
          New-Item -ItemType Directory -Force $slot | Out-Null
          $password=[guid]::NewGuid().ToString('N').Substring(0,16)
          $token=[guid]::NewGuid().ToString('N')+[guid]::NewGuid().ToString('N')
          $env:SHAIYA_OFFLINE_SLOT=$slot
          $env:SHAIYA_OFFLINE_PASSWORD=$password
          $env:SHAIYA_OFFLINE_TOKEN=$token
          $env:SHAIYA_OFFLINE_FACTION='light'
          $env:SHAIYA_PROTOCOL_OAUTH='localplayer:'+$password
          $loginExe=(Resolve-Path 'backend/login/Imgeneus.Login.exe').Path
          $worldExe=(Resolve-Path 'backend/world/Imgeneus.World.exe').Path
          $login=Start-Process $loginExe -WorkingDirectory (Split-Path $loginExe) -PassThru -WindowStyle Hidden
          $world=$null
          function Wait-Health([int]$port){
            $headers=@{Authorization='Bearer '+$token}
            for($i=0;$i -lt 120;$i++){
              if($login.HasExited){throw 'Login backend exited early'}
              try{
                $r=Invoke-WebRequest -UseBasicParsing -Uri ('http://127.0.0.1:'+ $port +'/offline/status') -Headers $headers -TimeoutSec 2
                if($r.StatusCode -eq 200){return}
              }catch{}
              Start-Sleep -Milliseconds 500
            }
            throw ('backend health timeout '+$port)
          }
          try{
            Wait-Health 5000
            $world=Start-Process $worldExe -WorkingDirectory (Split-Path $worldExe) -PassThru -WindowStyle Hidden
            $headers=@{Authorization='Bearer '+$token}
            for($i=0;$i -lt 120;$i++){
              if($world.HasExited){throw 'World backend exited early'}
              try{
                $r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5001/offline/status' -Headers $headers -TimeoutSec 2
                if($r.StatusCode -eq 200){break}
              }catch{}
              Start-Sleep -Milliseconds 500
              if($i -eq 119){throw 'world health timeout'}
            }
            flutter test test/ps0032_live_test.dart --reporter expanded
            if($LASTEXITCODE -ne 0){throw 'live ps0032 bootstrap test failed'}
          }finally{
            if($world -and !$world.HasExited){Stop-Process -Id $world.Id -Force}
            if(!$login.HasExited){Stop-Process -Id $login.Id -Force}
          }

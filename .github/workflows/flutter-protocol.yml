name: Flutter ps0032 protocol probe
on:
  push:
    branches: [work/flutter-protocol-ps0032]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-protocol-ps0032
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35546792715
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend-archive
      - name: Prepare backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check zstandard
          @'
          import pathlib,tarfile,zstandard
          src=pathlib.Path('backend-archive/native-services-win-x64.tar.zst')
          dst=pathlib.Path('backend');dst.mkdir(exist_ok=True)
          with src.open('rb') as f:
            with zstandard.ZstdDecompressor().stream_reader(f) as stream:
              with tarfile.open(fileobj=stream,mode='r|') as t:t.extractall(dst,filter='data')
          print('backend',sum(1 for p in dst.rglob('*') if p.is_file()))
          '@ | Set-Content extract_backend.py
          python extract_backend.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Start validated offline backend and probe protocol
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force protocol-proof,protocol-slot | Out-Null
          $secret='ProtocolLocal2026!'
          $token='0123456789abcdef0123456789abcdef0123456789abcdef'
          $env:SHAIYA_OFFLINE_SLOT=(Resolve-Path protocol-slot).Path
          $env:SHAIYA_OFFLINE_FACTION='light'
          $env:SHAIYA_OFFLINE_PASSWORD=$secret
          $env:SHAIYA_OFFLINE_TOKEN=$token
          $env:SHAIYA_PROTOCOL_REPORT=(Join-Path (Resolve-Path protocol-proof).Path 'protocol.json')
          function Wait-Health([int]$port){
            $deadline=(Get-Date).AddSeconds(60)
            while((Get-Date) -lt $deadline){
              try{
                $r=Invoke-WebRequest -UseBasicParsing -Uri ("http://127.0.0.1:"+$port+"/offline/status") -Headers @{Authorization=("Bearer "+$token)} -TimeoutSec 2
                if($r.StatusCode -eq 200){return}
              }catch{}
              Start-Sleep -Milliseconds 400
            }
            throw "health timeout $port"
          }
          $login=Start-Process (Resolve-Path backend/login/Imgeneus.Login.exe) -WorkingDirectory (Resolve-Path backend/login) -RedirectStandardOutput protocol-proof/login.log -RedirectStandardError protocol-proof/login.err -PassThru
          try{
            Wait-Health 5000
            $world=Start-Process (Resolve-Path backend/world/Imgeneus.World.exe) -WorkingDirectory (Resolve-Path backend/world) -RedirectStandardOutput protocol-proof/world.log -RedirectStandardError protocol-proof/world.err -PassThru
            try{
              Wait-Health 5001
              dart run tool/protocol_probe.dart
              if($LASTEXITCODE -ne 0){throw 'protocol probe failed'}
              $report=Get-Content protocol-proof/protocol.json -Raw | ConvertFrom-Json
              if(!$report.ok){throw 'protocol report not ok'}
              if($report.keyBytes -ne 16 -or $report.ivBytes -ne 16 -or $report.sessionBytes -ne 16){throw 'invalid crypto/session sizes'}
              if($report.faction -lt 0){throw 'ACCOUNT_FACTION missing'}
            }finally{
              if(!$world.HasExited){Stop-Process -Id $world.Id -Force}
            }
          }finally{
            if(!$login.HasExited){Stop-Process -Id $login.Id -Force}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-PS0032-Protocol-Proof
          path: protocol-proof/
          retention-days: 14

name: Extractor temporal de pruebas
on:
  push:
    branches: [feat/flutter-native-studio]
    paths: [.github/workflows/extractor_tools.yml]
permissions:
  contents: read
jobs:
  extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Preparar herramientas publicas para lectura local
        run: |
          mkdir -p extractor
          cp -a /usr/lib/7zip extractor/7zip
          cp -a "$FLUTTER_ROOT/bin/cache/artifacts/engine/common" extractor/engine-common
          cp -a "$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/frontend_server_aot.dart.snapshot" extractor/ || true
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' -czf extractor.tar.gz extractor
      - uses: actions/upload-artifact@v4
        with:
          name: Extractor-pruebas
          path: extractor.tar.gz
          retention-days: 1

name: Native game - WoW64 QA runner
on:
  push:
    branches: [work/native-game-tools-20260920]
    paths: [.github/workflows/native-wow64.yml]
permissions:
  contents: read
jobs:
  public-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify pinned public compatibility tool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 -o wine-11.0-amd64-wow64.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-amd64-wow64.tar.xz
          echo '39574efa1132c3ca0d5c77dd2eddbe4a49cca0d6cc2c290ff4924493a1c40314  wine-11.0-amd64-wow64.tar.xz' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: Native-WoW64-QA-Runner
          path: wine-11.0-amd64-wow64.tar.xz
          retention-days: 2
          compression-level: 0

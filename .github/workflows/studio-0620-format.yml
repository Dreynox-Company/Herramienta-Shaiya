name: Studio 0.6.22 formatting gate

on:
  push:
    branches:
      - feat/studio-0620-spk-wings
  pull_request:
    branches:
      - main
      - feat/studio-0612-spk-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify deterministic formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

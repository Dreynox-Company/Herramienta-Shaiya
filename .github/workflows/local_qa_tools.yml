name: Herramientas temporales de auditoria local
on:
  push:
    branches: [feat/flutter-native-studio]
    paths: [.github/workflows/local_qa_tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Preparar herramientas sin recursos del juego
        run: |
          mkdir -p local-tools/flutter/bin/cache/artifacts/engine
          cp -a "$FLUTTER_ROOT/bin/cache/dart-sdk" local-tools/
          cp -a "$FLUTTER_ROOT/packages" local-tools/flutter/
          cp -a "$FLUTTER_ROOT/bin/cache/pkg" local-tools/flutter/bin/cache/
          cp -a "$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64" local-tools/flutter/bin/cache/artifacts/engine/
          cp -a "$PUB_CACHE/hosted" local-tools/
          cp .dart_tool/package_config.json local-tools/package_config.json
          command -v 7z && cp "$(command -v 7z)" local-tools/7z || true
          test ! -d /usr/lib/p7zip || cp -a /usr/lib/p7zip local-tools/
          curl -fLs https://codeload.github.com/matigramirez/Parsec/tar.gz/refs/heads/main -o local-tools/Parsec-reference.tar.gz
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='test' --exclude='example' --exclude='.cache' -czf local-tools.tar.gz local-tools
      - uses: actions/upload-artifact@v4
        with:
          name: Herramientas-auditoria-temporal
          path: local-tools.tar.gz
          retention-days: 1

name: SPK R29 offline Flutter validation SDK
on:
  push:
    branches: [research/spk-real-20260926]
    paths: [.github/workflows/spk-r29-offline-sdk.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve the existing locked dependencies only
        run: flutter pub get --enforce-lockfile
      - name: Package public toolchain without application assets or user DATA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          sdk=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")
          flutter --version --machine > transfer/flutter-version.json
          printf '%s\n' 'Public SDK/dependencies only. Used locally to test private real SPK files, which are never uploaded to CI.' > transfer/README.txt
          tar --exclude='.git/objects' --exclude='bin/cache/artifacts/engine/android-*' --exclude='bin/cache/artifacts/engine/linux-x64-profile' --exclude='bin/cache/artifacts/engine/linux-x64-release' --exclude='bin/cache/artifacts/engine/linux-x64/font-subset' -C "$sdk" -czf transfer/flutter-sdk.tar.gz .
          tar -C "$HOME/.pub-cache" -czf transfer/pub-cache.tar.gz hosted
          sha256sum transfer/*.gz > transfer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SPK-R29-Offline-Flutter-SDK
          path: transfer/
          compression-level: 0
          retention-days: 3

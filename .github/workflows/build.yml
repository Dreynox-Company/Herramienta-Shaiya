name: Flutter nativo - validar y compilar
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Compilar auditor nativo de archivos
        run: dart compile exe tool/audit_assets.dart -o audit_assets_linux
      - uses: actions/upload-artifact@v4
        with:
          name: Auditor-Linux
          path: audit_assets_linux
          if-no-files-found: error
      - name: Fuentes verificables de esta revision
        run: git archive --format=zip -o Herramienta-Shaiya-Fuentes.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Fuentes-y-dependencias
          path: |
            Herramienta-Shaiya-Fuentes.zip
            pubspec.lock
      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas de formatos, texturas, conjuntos y combate
        run: flutter test --reporter expanded
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Comprobar arranque nativo
        shell: pwsh
        run: ./tool/smoke_windows.ps1
      - name: Incluir instrucciones
        shell: pwsh
        run: Copy-Item LEEME_WINDOWS.txt build/windows/x64/runner/Release/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Prueba-arranque-Windows
          path: qa-windows/
          if-no-files-found: ignore
  android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CMake requerido por flutter_angle
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-shaiya"
          "$RUNNER_TEMP/cmake-shaiya/bin/pip" install --disable-pip-version-check cmake==3.31.4
          echo "$RUNNER_TEMP/cmake-shaiya/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake-shaiya/bin/cmake" --version
      - run: python3 tool/prepare.py
      - run: flutter pub get
      - name: APK de prueba firmado con clave de depuracion
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Android-Pruebas
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  linux-qa:
    needs: tests
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Dependencias del entorno grafico de validacion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libegl1-mesa-dev libepoxy-dev libgl1-mesa-dev libglx-dev libopengl-dev
      - run: flutter create --no-pub --platforms=linux --org com.dreynox --project-name herramienta_shaiya .
      - run: flutter pub get
      - name: Compatibilidad del backend de validacion Linux
        run: python3 tool/qa_linux_compat.py
      - run: flutter build linux --release
      - name: Conservar permisos del ejecutable
        run: tar -czf Shaiya-Linux-QA.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-validacion-interna
          path: Shaiya-Linux-QA.tar.gz
          if-no-files-found: error
          retention-days: 7

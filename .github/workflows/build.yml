name: Flutter nativo - validar y compilar
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas de formatos, texturas, conjuntos y combate
        run: flutter test --reporter expanded
      - name: Compilar auditor nativo de archivos
        run: dart compile exe tool/audit_assets.dart -o audit_assets_linux
      - uses: actions/upload-artifact@v4
        with:
          name: Auditor-Linux
          path: audit_assets_linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Dependencias-resueltas
          path: pubspec.lock
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Incluir instrucciones
        shell: pwsh
        run: Copy-Item LEEME_WINDOWS.txt build/windows/x64/runner/Release/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
  android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare.py
      - run: flutter pub get
      - name: APK de prueba firmado con clave de depuracion
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Android-Pruebas
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

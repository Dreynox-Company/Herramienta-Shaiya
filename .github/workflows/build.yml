name: Flutter nativo - validar y compilar
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validar sintaxis y formatear fuentes de entrega
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analisis estatico
        run: |
          mkdir -p qa-sources
          flutter analyze 2>&1 | tee qa-sources/analyze.txt
      - name: Pruebas de movimiento, selectores, paneles y formatos
        run: flutter test --reporter expanded --file-reporter=json:qa-sources/flutter-tests.json
      - name: Pruebas de integridad y scripts de entrega
        run: python3 -m unittest discover -s tool/tests -v 2>&1 | tee qa-sources/python-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruebas-fuentes-05
          path: qa-sources/
          if-no-files-found: ignore
      - name: Auditor nativo de clips originales
        run: dart compile exe tool/audit_locomotion.dart -o auditor_movimiento
      - uses: actions/upload-artifact@v4
        with:
          name: Auditor-movimiento
          path: auditor_movimiento
          if-no-files-found: error
      - name: Fuentes de la revision
        run: python3 tool/package_sources.py Shaiya-Studio-Fuentes.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fuentes-y-dependencias
          path: Shaiya-Studio-Fuentes.zip
          if-no-files-found: error
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get --enforce-lockfile
      - name: Generar biblioteca sintetica de regresion
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'shaiya-native-fixture'
          $qa = Join-Path $env:GITHUB_WORKSPACE 'qa-native'
          python tool/make_native_fixture.py $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Error generando los recursos sinteticos.' }
          "SHAIYA_FIXTURE_PATH=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHAIYA_QA_PATH=$qa" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Integracion nativa - editor, archivo, vuelo, monturas y objetivos
        run: flutter test integration_test/native_studio_test.dart -d windows --reporter expanded
      - run: flutter build windows --release
      - name: Comprobar arranque nativo de release
        shell: pwsh
        run: ./tool/smoke_windows.ps1
      - name: Incluir instrucciones y procedencia de compilacion
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          Copy-Item LEEME_WINDOWS.txt "$release/LEEME.txt"
          Copy-Item INSTRUCCIONES.md "$release/INSTRUCCIONES.md"
          New-Item -ItemType Directory -Force "$release/docs" | Out-Null
          Copy-Item docs/revision-05.md "$release/docs/revision-05.md"
          Copy-Item docs/entrega-05.md "$release/docs/entrega-05.md"
          @{version='0.5.0+7';commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;platform='windows-x64';mode='release'} | ConvertTo-Json | Set-Content -Encoding utf8 "$release/build-provenance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruebas-nativas-Windows
          path: |
            qa-windows/
            qa-native/
          if-no-files-found: ignore
  android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: CMake requerido por flutter_angle
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-shaiya"
          "$RUNNER_TEMP/cmake-shaiya/bin/pip" install --disable-pip-version-check cmake==3.31.4
          echo "$RUNNER_TEMP/cmake-shaiya/bin" >> "$GITHUB_PATH"
      - run: python3 tool/prepare.py
      - run: flutter pub get --enforce-lockfile
      - name: Compilar APK con reintento limitado solo para errores de red
        shell: bash
        run: |
          mkdir -p qa-android
          for attempt in 1 2 3; do
            if flutter build apk --debug 2>&1 | tee "qa-android/build-$attempt.log"; then
              exit 0
            fi
            if ! grep -Eiq '429|503|Too Many Requests|timed out|Could not GET|Could not resolve host' "qa-android/build-$attempt.log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 60))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostico-compilacion-Android
          path: qa-android/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Shaiya-Studio-Android-Pruebas
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  linux-qa:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libegl1-mesa-dev libepoxy-dev libgl1-mesa-dev libglx-dev libopengl-dev libgles2
      - run: python3 tool/prepare.py --platforms linux
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/qa_linux_compat.py
      - run: flutter build linux --release
      - name: Empaquetar entorno de prueba nativo
        run: |
          cp -L /lib/x86_64-linux-gnu/libGLESv2.so.2 build/linux/x64/release/bundle/lib/
          tar -czf Shaiya-Linux-QA.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-validacion-interna
          path: Shaiya-Linux-QA.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/studio-05-')
    needs: [tests, windows, android, linux-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shaiya-Studio-Windows-x64
          path: cloud-artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: Shaiya-Studio-Android-Pruebas
          path: cloud-artifacts/android
      - name: Publicar solo los binarios de esta ejecucion y sus hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/publish_release.py

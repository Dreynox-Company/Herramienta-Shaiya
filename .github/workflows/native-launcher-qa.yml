name: Native launcher - Windows build and lifecycle
on:
  push:
    branches: [work/native-game-tools-20260920]
    paths: [.github/workflows/native-launcher-qa.yml, 'native-launcher/**']
permissions:
  contents: read
  actions: read
jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35536595183
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend
      - name: Build native C++ launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-output,proof | Out-Null
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          @"
          @echo off
          call "$dev" -arch=x64
          cl /nologo /std:c++17 /EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS /MT /O2 native-launcher\launcher.cpp /Fe:launcher-output\Jugar_Offline.exe /link /SUBSYSTEM:WINDOWS ws2_32.lib winhttp.lib bcrypt.lib ole32.lib uuid.lib shell32.lib comctl32.lib gdi32.lib user32.lib
          "@ | Set-Content compile.cmd
          & cmd /c compile.cmd
          if($LASTEXITCODE -ne 0){throw 'Native launcher compilation failed'}
          Copy-Item native-launcher/launcher.cpp launcher-output/
          Get-FileHash launcher-output/* -Algorithm SHA256 | Format-List | Out-File launcher-output/SHA256.txt
      - name: Prepare publicly sourced native client and raw resource folder
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('.github/workflows/native-windows-silent-probe.yml').read_text()); pathlib.Path('prepare_reference.ps1').write_text(d['jobs']['diagnostic']['steps'][1]['run'])"
          & ./prepare_reference.ps1
          if($LASTEXITCODE -ne 0){throw 'Public reference preparation failed'}
          $probe=(Get-Content game-path.txt -Raw).Trim()
          python native-ci/prepare_raw.py $probe
          if($LASTEXITCODE -ne 0){throw 'Raw DATA failed'}
          $dir=Split-Path $probe
          New-Item -ItemType Directory -Force launcher-output/cliente | Out-Null
          Get-ChildItem $dir -File | Where-Object {$_.Extension -in @('.dll','.ini','.cfg') -or $_.Name -eq 'game.exe'} | Copy-Item -Destination launcher-output/cliente
          Move-Item services launcher-output/servicios
          $homeDir=Join-Path $env:LOCALAPPDATA 'Dreynox\ShaiyaOffline'
          New-Item -ItemType Directory -Force $homeDir | Out-Null
          "[Recursos]`r`nData=$dir\data`r`n" | Set-Content (Join-Path $homeDir 'launcher.ini') -Encoding Unicode
          'Native launcher test; original game is not audio-patched.' | Set-Content launcher-output/LEEME.txt
      - name: Verify GUI, original-client launch, junction and service cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Shot([string]$n){$r=[Windows.Forms.SystemInformation]::VirtualScreen;$b=[Drawing.Bitmap]::new($r.Width,$r.Height);$g=[Drawing.Graphics]::FromImage($b);$g.CopyFromScreen($r.Left,$r.Top,0,0,$r.Size);$b.Save((Join-Path (Resolve-Path proof) $n));$g.Dispose();$b.Dispose()}
          $p=Start-Process (Resolve-Path launcher-output/Jugar_Offline.exe) -WorkingDirectory (Resolve-Path launcher-output) -ArgumentList '--autostart' -PassThru
          try {
            $g=$null
            for($i=0;$i -lt 60;$i++){Start-Sleep 1;$g=Get-Process game -ErrorAction SilentlyContinue;if($g){break}}
            Shot 'launcher-and-original-client.png'
            if(!$g){throw 'The native launcher never started game.exe'}
            $ws=New-Object -ComObject WScript.Shell
            Start-Sleep 5
            if($ws.AppActivate($g.Id)){Start-Sleep 1;$ws.SendKeys('{ENTER}')}
            Start-Sleep 5
            $g.Refresh()
            if(!$g.HasExited){$g.CloseMainWindow()|Out-Null}
            for($i=0;$i -lt 70;$i++){Start-Sleep 1;$back=Get-Process Imgeneus.Login,Imgeneus.World -ErrorAction SilentlyContinue;if(!$back){break}}
            Shot 'launcher-after-client-close.png'
            if(Get-Process Imgeneus.Login,Imgeneus.World -ErrorAction SilentlyContinue){throw 'Backend children were not cleaned up'}
            $homeDir=Join-Path $env:LOCALAPPDATA 'Dreynox\ShaiyaOffline'
            Copy-Item (Join-Path $homeDir 'registros') proof -Recurse
            Get-Item launcher-output/cliente/data | Select-Object FullName,LinkType,Target | ConvertTo-Json | Set-Content proof/junction.json
            @'
          import sqlite3,pathlib,os,json,hashlib
          home=pathlib.Path(os.environ['LOCALAPPDATA'])/'Dreynox/ShaiyaOffline'
          dbs=[]
          for p in (home/'partidas').rglob('*.sqlite'):
            with sqlite3.connect(p) as c:result=c.execute('PRAGMA quick_check').fetchone()[0]
            assert result=='ok';dbs.append({'name':p.name,'quick_check':result})
          digest=hashlib.sha256(pathlib.Path('launcher-output/cliente/game.exe').read_bytes()).hexdigest()
          assert digest=='509c4a8fbe4d5292961fdfb6d1045795a7bb5970fcf2560fd1070aee18273c2d'
          pathlib.Path('proof/launcher-lifecycle.json').write_text(json.dumps({'databases':dbs,'nativeClientSha256':digest,'originalClientLaunched':True,'backendProcessesClosed':True,'worldRenderingClaim':False,'scope':'Launcher lifecycle; original native client remains blocked by absent headless audio endpoint'},indent=2))
          '@ | Set-Content verify.py
            python verify.py
            if($LASTEXITCODE -ne 0){throw 'Lifecycle integrity check failed'}
          } finally {Get-Process game,Imgeneus.Login,Imgeneus.World -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Launcher-Windows-Proof
          path: proof/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Launcher-Windows-Binary-Source
          path: |
            launcher-output/Jugar_Offline.exe
            launcher-output/launcher.cpp
            launcher-output/SHA256.txt
          retention-days: 7

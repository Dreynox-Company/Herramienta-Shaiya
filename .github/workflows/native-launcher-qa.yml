name: Native launcher - Windows build and lifecycle
on:
  push:
    branches: [work/native-game-tools-20260920]
    paths: [.github/workflows/native-launcher-qa.yml, 'native-launcher/**']
permissions:
  contents: read
  actions: read
jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          run-id: 35536595183
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend
      - name: Recover immutable lifecycle test and correct checksum self-inclusion
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          @'
          import urllib.request,pathlib,yaml
          url='https://raw.githubusercontent.com/Dreynox-Company/Herramienta-Shaiya/be2e5affce66519ef77db27f6fa6d6cf29709aed/.github/workflows/native-launcher-qa.yml'
          with urllib.request.urlopen(url,timeout=30) as r:source=r.read().decode()
          steps=yaml.safe_load(source)['jobs']['launcher']['steps']
          for index,name in [(2,'build'),(3,'prepare'),(4,'lifecycle')]:
            script=steps[index]['run']
            if name=='build':
              assert script.count('Get-FileHash launcher-output/* -Algorithm SHA256')==1
              script=script.replace('Get-FileHash launcher-output/* -Algorithm SHA256','Get-FileHash launcher-output/Jugar_Offline.exe,launcher-output/launcher.cpp -Algorithm SHA256')
            pathlib.Path('qa-'+name+'.ps1').write_text(script,encoding='utf-8')
          '@ | Set-Content recover.py
          python recover.py
          if($LASTEXITCODE -ne 0){throw 'Pinned lifecycle source unavailable'}
      - name: Build native C++ launcher
        shell: pwsh
        run: ./qa-build.ps1
      - name: Prepare public native client and raw DATA
        shell: pwsh
        run: ./qa-prepare.ps1
      - name: Verify native launcher lifecycle
        shell: pwsh
        run: ./qa-lifecycle.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Launcher-Windows-Proof
          path: proof/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Launcher-Windows-Binary-Source
          path: |
            launcher-output/Jugar_Offline.exe
            launcher-output/launcher.cpp
            launcher-output/SHA256.txt
          retention-days: 7

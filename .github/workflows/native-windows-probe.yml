name: Native game - Windows compatibility probe
on:
  push:
    branches: [work/native-game-tools-20260920]
    paths: [.github/workflows/native-windows-probe.yml, 'native_client/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-windows-probe
  cancel-in-progress: true
jobs:
  native-public-reference:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public inspection dependencies
        run: python -m pip install pefile==2024.8.26 pillow zstandard
      - uses: actions/download-artifact@v4
        with:
          name: Native-Backend-Windows
          path: backend
          run-id: 35536595183
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test public hash-matched native client; never upload game data
        run: python native_client/windows_launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Windows-Proof
          path: native-proof/
          retention-days: 7
          if-no-files-found: error

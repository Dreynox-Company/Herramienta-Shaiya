name: ShStudio R27 SPK workspace mouse and branding
on:
  push:
    branches: [fix/studio-0627-spk-navigation-orbit-brand]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-r27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.ref == 'refs/heads/fix/studio-0627-spk-navigation-orbit-brand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-0627-spk-navigation-orbit-brand
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Verify and recover the interrupted source changes
        run: python ci/apply_r27.py
      - name: Apply reviewed contract and preview corrections
        run: |
          python ci/refine_r27_review.py
          python ci/refine_r27_material_tests.py
      - name: Generate exact provided icon assets
        run: python tool/prepare_branding.py
      - name: Register every regression in the local runner
        shell: python
        run: |
          from pathlib import Path
          tests = sorted(Path('test').glob('*_test.dart'))
          imports = [f"import '../test/{p.name}' as suite{i};" for i, p in enumerate(tests)]
          calls = [f'  suite{i}.main();' for i in range(len(tests))]
          Path('tool/run_all_local.dart').write_text('// Complete local regression runner. Keep synchronized with test/*_test.dart.\n' + '\n'.join(imports) + '\n\nvoid main() {\n' + '\n'.join(calls) + '\n}\n')
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format readable sources
        run: dart format lib test integration_test tool
      - name: Mechanical lint corrections only
        run: dart fix --apply --code=curly_braces_in_flow_control_structures,unnecessary_import,unused_import,use_null_aware_elements,unnecessary_brace_in_string_interps,sort_child_properties_last
      - name: Final source format
        run: dart format lib test integration_test tool
      - name: Commit exact source checkpoint on isolated branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/studio-0627-spk-navigation-orbit-brand'
          git diff --check
          git add lib test integration_test tool docs platform assets pubspec.yaml ci .studio-r27-applied .studio-r27-review-applied .studio-r27-material-tests-applied
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(studio): exact material rows, texture pairing and distinct SPK overlay revisions [skip ci]'
            git push origin HEAD:refs/heads/fix/studio-0627-spk-navigation-orbit-brand
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source and failure diagnostics
        if: always()
        run: |
          git archive --format=zip HEAD -o studio-r27-source.zip
          git diff --binary > studio-r27-uncommitted.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-R27-Source-Checkpoint
          path: |
            studio-r27-source.zip
            studio-r27-uncommitted.diff
          retention-days: 30
  verify:
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read

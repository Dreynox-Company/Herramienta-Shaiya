name: Studio 0.6.2 - SPK browser and extraction
on:
  push:
    branches: [feat/studio-062-spk-browser]
    paths:
      - .github/workflows/spk-062-build.yml
      - ci/transfers/spk_browser.dart.xz.b64
      - lib/data/spk_source.dart
      - lib/ui/spk_browser.dart
      - lib/main.dart
      - test/spk_source_test.dart
      - integration_test/spk_native_test.dart
      - .github/workflows/build.yml
      - pubspec.yaml

concurrency:
  group: studio-062-spk-browser
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.finish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-062-spk-browser
          fetch-depth: 10
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Restore audited SPK archive-browser source
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma
          transfer = Path('ci/transfers/spk_browser.dart.xz.b64')
          target = Path('lib/ui/spk_browser.dart')
          if transfer.exists():
              packed = base64.b64decode(transfer.read_text().strip(), validate=True)
              source = lzma.decompress(packed)
              expected = '6068a20ec2a09ee2f107c8bb988994b1ce187c8c6a2bb8402b21a1615187af33'
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'SPK browser transfer hash mismatch: {actual}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source)
              transfer.unlink()
          if not target.exists() or target.stat().st_size < 10000:
              raise RuntimeError('SPK browser source missing or truncated')
      - name: Resolve native codec dependencies
        run: flutter pub get
      - name: Format touched Dart sources
        run: dart format lib/data/spk_source.dart lib/ui/spk_browser.dart lib/main.dart test/spk_source_test.dart
      - name: Focused SPK tests
        run: flutter test test/spk_source_test.dart --reporter expanded
      - name: Commit browser, deterministic lockfile and formatting
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shaiya Studio CI'
          git config user.email 'studio-ci@users.noreply.github.com'
          git add -A -- pubspec.lock lib/data/spk_source.dart lib/ui/spk_browser.dart lib/main.dart test/spk_source_test.dart ci/transfers/spk_browser.dart.xz.b64
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate Studio 0.6.2 SPK browser and extraction'
            git fetch origin feat/studio-062-spk-browser
            git rebase origin/feat/studio-062-spk-browser
            git push origin HEAD:feat/studio-062-spk-browser
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verified-windows:
    needs: integrate
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.integrate.outputs.source_commit }}

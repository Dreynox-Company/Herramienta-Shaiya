name: Format SPK 0.6.7 sources
on:
  push:
    branches: ['feat/studio-067-spk-full-resources']
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-only]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Format changed SPK sources
        run: |
          dart format lib/core/spk_archive.dart lib/data/spk_source.dart lib/ui/spk_archive_browser.dart test/spk_archive_test.dart test/spk_profile_discovery_test.dart
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "Dreynox CI"
          git config user.email "admin@dreynox.com"
          git add lib/core/spk_archive.dart lib/data/spk_source.dart lib/ui/spk_archive_browser.dart test/spk_archive_test.dart test/spk_profile_discovery_test.dart
          git commit -m "style(spk): Dart 3.13.3 format [format-only]"
          git push origin HEAD:${{ github.ref_name }}
